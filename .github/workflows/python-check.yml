name: Python syntax validation

on:
  push:
    branches: [ai-director-v2]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application modules
        run: python -m py_compile app.py vlog_core.py ai_director.py
